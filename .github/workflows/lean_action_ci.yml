name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs on the same branch (saves CI minutes on rapid pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
