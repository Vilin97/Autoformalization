name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v3.1.1/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build documentation
        run: |
          mkdir -p docbuild
          cat << EOF > docbuild/lakefile.toml
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          name = "aristotle"
          path = "../"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "$(< lean-toolchain cut -f 2 -d: )"
          EOF
          cd docbuild
          git remote set-url origin https://github.com/Vilin97/aristotle.git || true
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update aristotle
          lake build Aristotle:docs

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docbuild/.lake/build/doc

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build_docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: _site/docs

      - name: Prepare site
        run: |
          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Aristotle Project</title>
            <style>
              body { font-family: sans-serif; margin: 40px; line-height: 1.6; }
              a { color: #0366d6; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Aristotle Project</h1>
            <p>Formal mathematics in Lean 4.</p>
            <ul>
              <li><a href="docs/">Lean Documentation</a> -- API documentation</li>
              <li><a href="https://github.com/Vilin97/aristotle">GitHub repository</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
